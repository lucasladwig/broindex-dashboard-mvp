[project]
name = "broindex-dashboard-mvp"
version = "0.1.0"
description = "Interactive dashboard for monitoring ambient conditions in broiler chicken sheds."
readme = "README.md"
authors = [
    { name = "Lucas Ladwig", email = "lucasladwig@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dash>=2.17.0",
    "dash-bootstrap-components>=1.6.0",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.30",
]

[project.scripts]
broindex-dashboard-mvp = "broindex_dashboard_mvp:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]